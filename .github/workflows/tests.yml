# Runs the test suite on every push and pull request (CPU only, a few minutes).
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install course environment (CPU)
        run: |
          pip install -r requirements-torch-cpu.txt
          pip install -r requirements.txt
          pip install -e .
      - name: Run tests
        run: python -m pytest
